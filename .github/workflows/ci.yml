name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: .terraform-plugins
          key: terraform-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
      - run: terraform fmt -check -recursive
      - name: validate every root module
        run: |
          for lock in $(git ls-files '*.terraform.lock.hcl'); do
            dir=$(dirname "$lock")
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
