[project]
name = "guarded-rag"
version = "0.1.0"
description = "A RAG app whose guardrail redacts PII, run locally on Floci"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "en-core-web-md",
    "presidio-analyzer>=2.2.366",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "boto3>=1.43.126",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guarded_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real Presidio", "e2e: needs the Compose stack"]
addopts = "-m 'not slow and not e2e'"

[tool.ruff]
line-length = 100
extend-exclude = ["spike", "prototype"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
