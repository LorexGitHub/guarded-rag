[project]
name = "guarded-rag"
version = "0.1.0"
description = "A RAG app whose guardrail redacts PII, run locally on Floci"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guarded_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real Presidio", "e2e: needs the Compose stack"]
addopts = "-m 'not slow and not e2e'"

[tool.ruff]
line-length = 100
extend-exclude = ["spike", "prototype"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
